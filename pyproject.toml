[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names, etc.)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (common bug patterns)
    "UP",   # pyupgrade (Python version upgrade suggestions)
    "SIM",  # flake8-simplify (simplifiable code)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501", # line too long
    # This worker handles Japanese/Korean/Chinese text; CJK punctuation such as
    # ？ and ・ is the subject matter, not a typo for its ASCII lookalike.
    "RUF001", # ambiguous characters in strings
    "RUF002", # ambiguous characters in docstrings
    "RUF003", # ambiguous characters in comments
]
