name: CI - Python

on:
  # `src/**` is where this repo's source actually lives (`app.py` is the only module at the
  # root). The filter used to say `worker/**`, which is the path this repo is mounted at as a
  # submodule of manga-tl — inside this repo it matches nothing, so a change confined to the
  # source tree skipped the whole job. `ci-docker.yml` had it right all along.
  #
  # `pyproject.toml` and `pyrightconfig.json` are here because the gates below read them: ruff's
  # rule selection and pyright's extraPaths can turn CI red without any source file changing.
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "app.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "app.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci-python.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run worker tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must track the Dockerfile's base image. AUDIT-D2 pinned requirements.txt to
          # the versions the running worker was on, and those are 3.13 builds: numpy
          # 2.3.5 publishes no wheel or sdist for 3.10, so CI could no longer install
          # the very requirements the image ships. Ruff's target-version is already
          # py313; this makes the interpreter agree with both.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 tesseract-ocr

      - name: Install dev tools
        run: pip install ruff pyright pytest pytest-cov

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (pyright)
        run: pyright .

      # tests/test_page_scene_contract.py pins the worker's scene model to the page-scene/v1
      # schema and fixtures that live in the parent repo (manga-tl/contracts). As a submodule the
      # worker finds them at ../contracts; this standalone checkout has no parent, so fetch just
      # that directory from the manga-tl branch of the same name, or main once it has merged.
      - name: Fetch the page-scene contract from manga-tl
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          clone() {
            git clone --quiet --depth 1 --filter=blob:none --sparse "$@" \
              https://github.com/sagniKdas53/manga-tl.git "$RUNNER_TEMP/manga-tl"
          }
          clone --branch "$ref" || clone
          git -C "$RUNNER_TEMP/manga-tl" sparse-checkout set contracts
          ls "$RUNNER_TEMP/manga-tl/contracts"

      - name: Run test suite
        env:
          PYTHONPATH: src
          PAGE_SCENE_SCHEMA: ${{ runner.temp }}/manga-tl/contracts/page-scene-v1.schema.json
          PAGE_SCENE_FIXTURES: ${{ runner.temp }}/manga-tl/contracts/fixtures/page-scene-v1
        run: pytest tests/ --cov=. --cov-report=xml
