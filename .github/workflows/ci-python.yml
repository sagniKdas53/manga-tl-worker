name: CI - Python

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "app.py"
      - "requirements.txt"
      - "tests/**"
      - "worker/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "app.py"
      - "requirements.txt"
      - "tests/**"
      - "worker/**"
      - ".github/workflows/ci-python.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run worker tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must track the Dockerfile's base image. AUDIT-D2 pinned requirements.txt to
          # the versions the running worker was on, and those are 3.13 builds: numpy
          # 2.3.5 publishes no wheel or sdist for 3.10, so CI could no longer install
          # the very requirements the image ships. Ruff's target-version is already
          # py313; this makes the interpreter agree with both.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 tesseract-ocr

      - name: Install dev tools
        run: pip install ruff pyright pytest pytest-cov

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (pyright)
        run: pyright .

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: pytest tests/ --cov=. --cov-report=xml
