name: Release

# Cuts a semver tag from conventional commits, publishes a GitHub Release, then builds the
# image for it.
#
# Tag-only versioning is deliberate: nothing here rewrites a version into a manifest file.
# This repo has no version string to bump — requirements.txt pins dependencies, not itself —
# and it is a submodule of manga-tl, so a version committed here would immediately disagree
# with the parent's pointer. The git tag is the single source of truth and the image tags are
# derived from it.
#
# Note the image build is *called*, not triggered. A tag pushed with GITHUB_TOKEN does not
# start another workflow run, so `on: push: tags` in ci-docker.yml would never fire.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Two merges landing in quick succession would otherwise both compute a bump from the same
# last tag and race to create it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag from conventional commits
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.new_version }}
      tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The action reads every commit back to the previous tag to decide the bump.
          fetch-depth: 0

      - name: Compute and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # No conventional-commit prefix in the range means no release. Without this the
          # action bumps patch on every merge, and a docs-only commit would cut a version.
          default_bump: "false"
          tag_prefix: v

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

  publish:
    name: Publish release image
    needs: tag
    if: needs.tag.outputs.version != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/ci-docker.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit
