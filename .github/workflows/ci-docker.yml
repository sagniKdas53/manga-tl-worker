name: CI - Docker Publish

# Two entry points, deliberately:
#
#   push        — every merge to main that touches the image, moving `latest`/`main`/`master`.
#   workflow_call — invoked by release.yml after it cuts a vX.Y.Z tag, to publish the semver
#                 tags for that release.
#
# The obvious alternative — `on: push: tags: ["v*"]` — does not work here. A tag pushed by a
# workflow using GITHUB_TOKEN never triggers another workflow (GitHub's recursion guard), so
# the release tag would silently publish nothing. Being called directly sidesteps that without
# needing a PAT. It also avoids the second trap: `paths:` below is ANDed with the ref filters,
# and a tag push carries no changed files, so a tag build would be filtered out anyway.

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "app.py"
      - "requirements.txt"
      - "src/**"
      - ".github/workflows/ci-docker.yml"
  workflow_call:
    inputs:
      version:
        description: "Semver with no leading v (e.g. 1.4.0). When set, publishes X.Y.Z, X.Y and X alongside latest."
        type: string
        required: true
  workflow_dispatch:

# A release commit fires this twice: once from `push` (it touched the image) and once from
# release.yml's call, for the semver tags. One shared group with no cancellation serialises
# them, so they cannot race for the `latest` pointer. Cancelling is deliberately off: with
# cancel-in-progress a later merge would kill an in-flight release build, which is the one
# build that must not be lost. Both runs build the same commit and the second simply re-points
# the same tags, so the cost is cache-warm CI minutes, not correctness.
concurrency:
  group: worker-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push worker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Downcase registry owner
        id: registry_owner
        shell: bash
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.registry_owner.outputs.owner }}/manga-tl-worker
          # `master` is published alongside `main` on purpose. This repo's default branch is
          # `main` while yt-diff's is `master`, and reaching for `:master` here is what produced
          # `denied: denied` on pull — GHCR reports a path it cannot resolve as denied rather
          # than 404. A tag is a pointer, so the alias costs no storage.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=master,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{major}}.{{minor}}.{{patch}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          # Carries org.opencontainers.image.source, which is what links the GHCR package back
          # to this repository.
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          # amd64 only, unlike the backend image, and this is not an oversight. requirements.txt
          # pins paddlepaddle==3.3.1, which publishes no linux_aarch64 wheel to PyPI — only
          # manylinux1_x86_64, macosx_11_0_arm64 and win_amd64 — so an arm64 build dies at
          # `pip install`. Revisit only via Baidu's own aarch64 wheel index, not by adding a
          # platform here.
          platforms: linux/amd64
          # Every push otherwise minted an `unknown/unknown` attestation manifest that no tag
          # references and nothing reclaims. Drop this line to get SLSA provenance back.
          provenance: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
